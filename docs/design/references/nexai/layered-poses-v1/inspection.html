<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexai · ooglagen controleren</title>
    <link rel="stylesheet" href="/shared/tokens.css" />
    <link rel="stylesheet" href="/shared/fonts.css" />
    <link rel="stylesheet" href="../layered-v1/review.css" />
    <style>
      .sheet {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: var(--space-4);
      }
      article {
        padding: 16px;
        border: 1px solid var(--color-border);
        background: var(--color-surface-raised);
        border-radius: 12px;
      }
      article p {
        margin: var(--space-2) 0 0;
      }
      button {
        margin-bottom: var(--space-6);
      }
      @media (max-width: 800px) {
        .sheet {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
    <script type="module" src="inspection.js"></script>
  </head>
  <body>
    <main>
      <a href="review.html">← Terug naar de animaties</a>
      <h1>Alle ooglagen naast elkaar</h1>
      <p>
        Stilstaande controle van de nieuwe lagen, boven op de goedgekeurde
        houdingen.
      </p>
      <button id="toggle" type="button" aria-pressed="true">
        Toon originele ogen
      </button>
      <div class="sheet" id="sheet"></div>
      <p id="status" role="status">Laden…</p>
    </main>
  </body>
</html>
