name: nexo-school
services:
  postgres:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    container_name: nexo-postgres
    restart: unless-stopped
    env_file: /srv/data/nexo-school/current/postgres.env
    environment:
      POSTGRES_DB: nexo_identity_local
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - /srv/data/nexo-school/current/postgresql:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/10-nexo-roles.sh:ro
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - password_encryption=scram-sha-256
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nexo_identity_local']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    shm_size: 128m
    pids_limit: 100
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks: [database]
networks:
  database:
    name: nexo-school-db
